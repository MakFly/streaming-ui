<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>20 Streaming Responses</title>
<style>
:root{--bg:#f5f6f8;--surface:#ffffff;--surface2:#eef0f3;--border:#e3e6eb;--text:#0f172a;--muted:#64748b;--faint:#a3adbb;--accent:#2f6fed;--accent-soft:rgba(47,111,237,.12);--ok:#10b981;--warn:#f59e0b;--err:#ef4444;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--shadow:0 1px 2px rgba(15,23,42,.05),0 10px 30px -14px rgba(15,23,42,.18)}
:root[data-theme=dark]{--bg:#09090b;--surface:#121214;--surface2:#19191d;--border:#27272c;--text:#f4f4f5;--muted:#a1a1aa;--faint:#55555e;--accent:#5b9cff;--accent-soft:rgba(91,156,255,.14);--shadow:0 1px 2px rgba(0,0,0,.5),0 14px 36px -14px rgba(0,0,0,.7)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:0 16px 64px}
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--border);margin:0 -16px 24px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:13px}
.spacer{flex:1}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:12.5px;padding:6px 11px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface2)}
label.btn input{accent-color:var(--accent);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;max-width:1500px;margin:0 auto}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:flex-start;gap:10px}
.num{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:3px;min-width:22px}
.card-head h2{font-size:14px;margin:0 0 3px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card-head p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.tag{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.tag.alt{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.replay{margin-left:auto;flex-shrink:0}
.stage{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;min-height:230px;font-size:13.5px;line-height:1.6;display:flex;flex-direction:column;gap:12px;overflow:hidden}

/* chat scene */
.u{align-self:flex-end;background:var(--accent);color:#fff;padding:7px 12px;border-radius:14px 14px 4px 14px;max-width:85%;font-size:13px;line-height:1.45}
:root[data-theme=dark] .u{background:#2a2a30;color:var(--text)}
.a{font-size:13.5px;line-height:1.65;display:flex;flex-direction:column;gap:10px}
.a p{margin:0}
.w{opacity:0;animation:wIn .4s ease forwards}
@keyframes wIn{to{opacity:1}}
.tok{display:inline-block;opacity:0;filter:blur(6px);transform:translateY(5px);animation:tokIn .5s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes tokIn{to{opacity:1;filter:blur(0);transform:none}}
.cursor{display:inline-block;width:2px;height:1.05em;background:var(--text);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(2) infinite}
.cursor.blk{width:.55em;background:var(--accent);opacity:.9}
@keyframes blink{50%{opacity:0}}
.shimmer{background:linear-gradient(90deg,var(--muted) 0%,var(--muted) 38%,var(--text) 50%,var(--muted) 62%,var(--muted) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.7s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.spin{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--border);border-top-color:var(--accent);animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

/* skeleton */
.skrow{min-height:1.4em}
.sk{height:11px;border-radius:6px;margin:7px 0;background:linear-gradient(90deg,var(--border) 0%,color-mix(in srgb,var(--border) 40%,var(--surface)) 50%,var(--border) 100%);background-size:200% 100%;animation:skm 1.3s linear infinite;transition:opacity .25s}
.sk.fade{opacity:0}
@keyframes skm{to{background-position:-200% 0}}

/* thinking indicator */
.think{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);transition:opacity .3s,transform .3s}
.think.out{opacity:0;transform:translateY(-4px)}
.think .tm{font-family:var(--mono);font-size:11px;color:var(--faint)}
.dots{display:grid;grid-template-columns:repeat(3,4px);gap:3px;width:18px;height:18px;align-content:center;justify-content:center}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.22;display:block}
.dots.wave i{animation:dwave 1.5s ease-in-out infinite}
@keyframes dwave{0%,55%,100%{opacity:.18;transform:scale(.85)}22%{opacity:1;transform:scale(1.2)}}
.dots.spin i{animation:dspin .96s linear infinite}
@keyframes dspin{0%{opacity:1;transform:scale(1.25)}40%{opacity:.22;transform:scale(1)}100%{opacity:.22}}
.stars{width:18px;height:18px;overflow:visible}
.stars path{fill:var(--muted);transform-box:fill-box;transform-origin:center;animation:tw 1.6s ease-in-out infinite;opacity:.2}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.45)}45%{opacity:1;transform:scale(1)}}
.inf{width:28px;height:14px;overflow:visible}
.inf path{fill:none;stroke-width:1.8;stroke-linecap:round}
.inf .trk{stroke:var(--border)}
.inf .comet{stroke:var(--accent);stroke-dasharray:22 78;animation:comet 1.8s linear infinite}
@keyframes comet{to{stroke-dashoffset:-100}}

/* composer */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.composer{position:relative;border-radius:999px;padding:2px;order:10;margin-top:auto}
.composer .band,.composer .bloom{position:absolute;inset:0;border-radius:inherit;background:conic-gradient(from var(--a),transparent 0deg,transparent 235deg,#5eead4 268deg,#46baec 300deg,#e633a4 332deg,#00faa7 360deg);opacity:0;transition:opacity .7s;animation:lap 4.5s linear infinite;animation-play-state:paused}
.composer .bloom{inset:-5px;filter:blur(14px)}
.composer.active .band{opacity:1;animation-play-state:running}
.composer.active .bloom{opacity:.4;animation-play-state:running}
.composer .inner{position:relative;border-radius:inherit;background:var(--surface);border:1px solid var(--border);padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;overflow:hidden;min-height:44px}
.composer .inner>.bloom{inset:-8px;filter:blur(18px);opacity:0;animation-play-state:paused}
.composer.active .inner>.bloom{opacity:.28;animation-play-state:running}
.composer .ph{position:relative;flex:1;color:var(--faint);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer .ph.typed{color:var(--text)}
.composer .ctrls{position:relative;display:flex;align-items:center;gap:6px}
.mpill{font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted);background:var(--surface2)}
.send{width:28px;height:28px;border-radius:50%;background:var(--text);color:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:600;transition:transform .2s}
.send.go{transform:scale(.85)}
@keyframes lap{to{--a:360deg}}

/* agent progress */
.prog{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:4px 12px}
.prog-head{all:unset;display:flex;align-items:center;gap:10px;width:100%;padding:8px 0;cursor:pointer;font-size:13px;font-weight:500}
.prog-head .chev{margin-left:auto;color:var(--faint);transition:transform .3s;font-size:14px}
.prog.collapsed .chev{transform:rotate(-90deg)}
.prog-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s cubic-bezier(.2,.7,.2,1)}
.prog.collapsed .prog-body{grid-template-rows:0fr}
.prog-body>div{overflow:hidden}
.prog-list{padding:2px 0 8px}
.ring{width:16px;height:16px;transform:rotate(-90deg);flex-shrink:0}
.ring circle{fill:none;stroke-width:2.6}
.ring .bg{stroke:var(--border)}
.ring .fg{stroke:var(--accent);stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .5s ease}
.pstep{display:flex;align-items:center;gap:10px;padding:5px 0;color:var(--muted);font-size:13px;opacity:0;animation:stepIn .45s ease forwards}
@keyframes stepIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.pstep.active{color:var(--text)}
.pico{position:relative;width:16px;height:16px;flex-shrink:0}
.pico .ring{position:absolute;inset:0}
.pstep:not(.active) .ring .fg{opacity:0}
.chk{position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;background:var(--ok);color:#fff;font-size:9px;font-weight:700;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.pstep.done .chk{transform:scale(1)}

/* task list */
.tasks{display:flex;flex-direction:column;gap:4px}
.task{opacity:0;filter:blur(4px);transform:translateY(6px);transition:opacity .4s,filter .4s,transform .4s}
.task.in{opacity:1;filter:none;transform:none}
.task-h{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;padding:4px 0;cursor:pointer}
.task-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);transition:background .3s,box-shadow .3s}
.task.done .task-dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.unit{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s cubic-bezier(.2,.7,.2,1)}
.unit.in{grid-template-rows:1fr}
.unit>.unit-in{overflow:hidden;min-height:0;opacity:0;filter:blur(4px);transform:translateY(6px);transition:opacity .4s,filter .4s,transform .4s}
.unit.in>.unit-in{opacity:1;filter:none;transform:none}
.task-steps{padding-left:15px;border-left:1px solid var(--border);margin-left:2px}
.tstep{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:3px 0 5px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border:1px solid var(--border);border-radius:6px;font-size:11px;font-family:var(--mono);background:var(--surface);color:var(--text);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi{font-style:normal;font-size:10px}
.tmeta{color:var(--faint);font-size:11.5px;font-family:var(--mono)}

/* web search */
.trail{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:9px}
.trail::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:1px;background:var(--border)}
.trow{position:relative;display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap;opacity:0;filter:blur(4px);transform:translateY(5px);transition:opacity .4s,filter .4s,transform .4s}
.trow.in{opacity:1;filter:none;transform:none}
.trow .ico{position:absolute;left:-22px;top:50%;width:13px;height:13px;margin-top:-6.5px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:7.5px;font-weight:700;color:var(--muted)}
.trow .ico.b{color:#fff;border-color:transparent}
.trow .lbl{color:var(--muted)}
.trow .q{color:var(--text)}
.trow .meta{color:var(--faint);font-size:11.5px}
.trow.head{font-weight:600}
.trow.head .lbl{color:var(--text)}
.stack{display:flex;padding-left:6px}
.mark{width:22px;height:22px;border-radius:50%;margin-left:-7px;border:2px solid var(--surface2);font-size:9px;font-weight:700;color:#fff;display:grid;place-items:center;transition:transform .2s;cursor:default;position:relative}
.mark:hover{transform:translateY(-3px);z-index:2}
.mark.more{background:var(--surface);color:var(--muted);border-color:var(--border)}
.tail{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;padding-left:22px;transition:opacity .3s}
.tail.out{opacity:0}

/* reasoning */
.reason{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.reason-head{all:unset;display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;cursor:pointer;font-size:13px}
.reason-head .chev{color:var(--faint);font-size:11px;transition:transform .3s;display:inline-block}
.reason.open .chev{transform:rotate(90deg)}
.reason-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.7,.2,1)}
.reason.open .reason-body{grid-template-rows:1fr}
.reason-body>div{overflow:hidden;min-height:0}
.reason-text{max-height:110px;overflow:hidden;padding:0 12px 12px;font-size:12.5px;line-height:1.55;color:var(--muted);mask-image:linear-gradient(to bottom,transparent 0,#000 18px);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 18px)}

/* tool call */
.tool{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;font-size:12.5px}
.tool-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border)}
.tool-ico{width:18px;height:18px;border-radius:5px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700}
.tool-name{font-family:var(--mono);font-size:12px}
.tool-st{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px}
.tool-st.ok{color:var(--ok)}
.tool pre{margin:0;padding:10px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.tool-sub{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:8px 12px 0;border-top:1px solid var(--border)}
.k{color:#c084fc}.s{color:#4ade80}.n{color:#fbbf24}.b{color:#60a5fa}.p{color:var(--muted)}
:root:not([data-theme=dark]) .k{color:#7c3aed}:root:not([data-theme=dark]) .s{color:#15803d}:root:not([data-theme=dark]) .n{color:#b45309}:root:not([data-theme=dark]) .b{color:#1d4ed8}

/* code */
.code{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;font-size:12px}
.code-h{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.code-h .fn{color:var(--text)}
.code-h .st{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-family:Inter,system-ui,sans-serif}
.code-h .st.ok{color:var(--ok)}
.code pre{margin:0;padding:10px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.6;max-height:210px;overflow:auto;white-space:pre}
.code .ln{display:block;animation:wIn .25s ease forwards}
.kw{color:#f472b6}.fn{color:#60a5fa}.cm{color:var(--faint);font-style:italic}.ty{color:#2dd4bf}
:root:not([data-theme=dark]) .kw{color:#be185d}:root:not([data-theme=dark]) .fn{color:#1d4ed8}:root:not([data-theme=dark]) .ty{color:#0f766e}

/* table */
table{border-collapse:collapse;width:100%;font-size:12.5px;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface2)}
td:not(:first-child),th:not(:first-child){text-align:right;font-family:var(--mono);font-size:12px}
tr:last-child td{border-bottom:0}
tr.row{animation:rowIn .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.up{color:var(--ok)}.dn{color:var(--err)}
.tstat{font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:6px}

/* json */
.json{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.json pre{margin:0;padding:10px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}

/* citations */
.cite{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;margin:0 2px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:600;vertical-align:2px;line-height:1;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;cursor:default}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.sources{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--border);padding-top:9px;margin-top:4px}
.src{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);animation:stepIn .4s ease both}
.src .fav{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:700;flex-shrink:0}
.src b{color:var(--text);font-weight:500}
.src .n{font-family:var(--mono);font-size:10.5px;color:var(--faint);min-width:14px}

/* voice */
.player{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 14px}
.avatar{width:32px;height:32px;border-radius:50%;background:conic-gradient(from 200deg,#5eead4,#46baec,#e633a4,#00faa7,#5eead4);display:grid;place-items:center;flex-shrink:0;position:relative}
.avatar::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--surface)}
.avatar span{position:relative;z-index:1;font-size:13px}
.wave{display:flex;align-items:center;gap:2px;height:34px;flex:1}
.wave i{width:3px;height:3px;border-radius:2px;background:var(--accent);transition:height .11s ease;display:block}
.ptime{font-family:var(--mono);font-size:11px;color:var(--faint);min-width:76px;text-align:right}
.transcript{font-size:13px;color:var(--muted)}
.transcript .w{color:var(--text)}

/* multi-agent */
.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:520px){.agents{grid-template-columns:1fr}}
.agent{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;font-size:12.5px;display:flex;flex-direction:column;gap:7px;min-height:120px}
.agent-h{display:flex;align-items:center;gap:7px;font-weight:600;font-size:12px}
.agent-av{width:20px;height:20px;border-radius:6px;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
.agent-st{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.agent-st.ok{color:var(--ok)}
.agent .txt{color:var(--muted);line-height:1.5;flex:1}
.agent.done .txt{color:var(--text)}
.synth{border-left:2px solid var(--accent);padding-left:10px}
.synth .lbl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);font-weight:600;display:block;margin-bottom:3px}

.stat{font-size:11.5px;color:var(--faint);font-family:var(--mono)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
  <div><h1>20 Streaming Responses</h1><p>Patterns de réponse en streaming — 8 de la collection Agent, 12 classiques. Vanilla HTML/CSS/JS.</p></div>
  <div class="spacer"></div>
  <label class="btn"><input type="checkbox" id="loop" checked> Boucle</label>
  <button class="btn" id="theme">☾ Thème</button>
  <button class="btn" id="replayAll">↻ Tout rejouer</button>
</header>
<main class="grid" id="grid"></main>

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function mk(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rnd=(a,b)=>a+Math.random()*(b-a);

function timers(){const s=new Set();return{
  sleep:ms=>new Promise(r=>{const id=setTimeout(()=>{s.delete(id);r()},ms);s.add(id)}),
  every:(ms,fn)=>{const id=setInterval(fn,ms);s.add(id);return id},
  stop:id=>{clearInterval(id);clearTimeout(id);s.delete(id)},
  clear(){s.forEach(id=>{clearTimeout(id);clearInterval(id)});s.clear()}}}

/* ---------- primitives ---------- */

function chat(root,userText){root.classList.add('chat');const u=mk('div','u');u.textContent=userText;root.append(u);const a=mk('div','a');root.append(a);return a}
async function typeChars(el,text,t,ms=16,cursorCls='cursor'){const c=mk('span',cursorCls);el.append(c);for(const ch of text){c.before(document.createTextNode(ch));await t.sleep(ms+(ch==='.'||ch===','?ms*6:0))}c.remove()}
async function streamWords(el,text,t,{ms=60,cls='w'}={}){for(const w of text.split(' ')){const s=mk('span',cls);s.textContent=w;el.append(s,' ');await t.sleep(ms*rnd(.6,1.5)+(/[.:;]$/.test(w)?ms*3:0))}}
async function reveal(el,t,ms=420){await t.sleep(20);el.classList.add('in');await t.sleep(ms)}

const INF="M14 7 C17 2 26 2 26 7 C26 12 17 12 14 7 C11 2 2 2 2 7 C2 12 11 12 14 7";
function indicator(v){
  if(v==='wave'||v==='spin'){const order=[0,1,2,5,8,7,6,3];let s=`<span class="dots ${v}">`;for(let i=0;i<9;i++){const r=Math.floor(i/3),c=i%3;let st=v==='wave'?`animation-delay:${(r+c)*110}ms`:(i===4?'animation:none;opacity:.1':`animation-delay:${order.indexOf(i)*120}ms`);s+=`<i style="${st}"></i>`}return s+'</span>'}
  if(v==='stars'){const pts=[[9,3,1],[3,9,.8],[15,10,.9],[8,15,.7],[14,3,.6]];return `<svg class="stars" viewBox="0 0 18 18">${pts.map(([x,y,sc],i)=>`<g transform="translate(${x} ${y}) scale(${sc})"><path d="M0-3.2 L.9-.9 L3.2 0 L.9 .9 L0 3.2 L-.9 .9 L-3.2 0 L-.9-.9Z" style="animation-delay:${i*260}ms"/></g>`).join('')}</svg>`}
  if(v==='infinity')return `<svg class="inf" viewBox="0 0 28 14"><path class="trk" d="${INF}" pathLength="100"/><path class="comet" d="${INF}" pathLength="100"/></svg>`;
}
function thinking(v,label,t){const el=mk('div','think',indicator(v)+`<span class="shimmer">${label}</span><span class="tm">0.0s</span>`);const tm=$('.tm',el);const t0=performance.now();t.every(100,()=>{tm.textContent=((performance.now()-t0)/1000).toFixed(1)+'s'});return el}
function composer(text){return mk('div','composer',`<div class="bloom"></div><div class="band"></div><div class="inner"><div class="bloom"></div><span class="ph">${text||'Décris la tâche…'}</span><span class="ctrls"><span class="mpill">Fable 5</span><span class="send">↑</span></span></div>`)}

function hlJSON(src){return esc(src).replace(/("(?:[^"\\]|\\.)*"?)(\s*:)?|(-?\d+(?:\.\d+)?)|\b(true|false|null)\b|([{}\[\],])/g,(m,str,colon,num,bool,p)=>{if(str)return colon?`<span class="k">${str}</span>${colon}`:`<span class="s">${str}</span>`;if(num)return `<span class="n">${num}</span>`;if(bool)return `<span class="b">${bool}</span>`;return `<span class="p">${p}</span>`})}
function hlCode(src){return esc(src).replace(/("[^"]*"?|'[^']*'?|`[^`]*`?)|(\/\/.*)|\b(import|from|export|function|const|let|return|await|async|new|while|if|break|true|false|null)\b|\b([A-Z]\w+)\b|\b([a-z_]\w*)(?=\()|\b(\d+)\b/g,(m,s,c,kw,ty,fn,n)=>{if(s)return `<span class="s">${s}</span>`;if(c)return `<span class="cm">${c}</span>`;if(kw)return `<span class="kw">${kw}</span>`;if(ty)return `<span class="ty">${ty}</span>`;if(fn)return `<span class="fn">${fn}</span>`;return `<span class="n">${n}</span>`})}
async function streamHL(el,text,t,ms,hl,step=1){for(let i=step;i<=text.length;i+=step){el.innerHTML=hl(text.slice(0,i))+'<span class="cursor"></span>';await t.sleep(ms)}el.innerHTML=hl(text)}

{tag:'Classique',title:'Bloc de code',desc:'Code diffusé ligne par ligne avec coloration syntaxique en direct, entête de fichier et statut.',
 async run(root,t){const a=chat(root,"Écris un hook React qui lit un flux fetch.");
  const CODE=`import { useEffect, useState } from "react";

export function useStream(url: string) {
  const [chunks, setChunks] = useState<string[]>([]);
  const [done, setDone] = useState(false);

  useEffect(() => {
    const ctrl = new AbortController();
    (async () => {
      const res = await fetch(url, { signal: ctrl.signal });
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        setChunks((c) => [...c, dec.decode(value)]);
      }
      setDone(true);
    })();
    return () => ctrl.abort(); // annule si l'URL change
  }, [url]);

  return { text: chunks.join(""), done };
}`;
  const box=mk('div','code',`<div class="code-h"><span class="fn">useStream.ts</span><span>TypeScript</span><span class="st"><span class="spin"></span>Génération</span></div><pre></pre>`);a.append(box);

{tag:'Classique',title:'Citations inline',desc:'Texte diffusé avec des chips de citation qui surgissent et une liste de sources qui se construit en bas.',
 async run(root,t){const a=chat(root,"Quel est l'impact d'un design system sur la vélocité ?");
  const segs=[{t:"Les équipes qui adoptent un design system livrent leurs interfaces environ 30 % plus vite",c:{n:1,title:"State of Design Systems 2025",d:"zeroheight.com",col:'#7c3aed'}},{t:", et la dette visuelle recule nettement dès le deuxième trimestre",c:{n:2,title:"Design debt, measured",d:"figma.com",col:'#f24e1e'}},{t:". Le coût d'entrée reste réel : comptez trois à six semaines pour une première version exploitable",c:{n:3,title:"We shipped our design system in 6 weeks",d:"linkedin.com",col:'#0A66C2'}},{t:", après quoi le temps de revue par écran baisse d'un tiers.",c:null}];
  const p=mk('p');a.append(p);let src=null;await t.sleep(300);
  for(const s of segs){await streamWords(p,s.t,t,{ms:55});if(s.c){const ch=mk('sup','cite',String(s.c.n));ch.title=s.c.title;p.append(ch,' ');if(!src){src=mk('div','sources');a.append(src)}src.append(mk('div','src',`<span class="n">${s.c.n}</span><span class="fav" style="background:${s.c.col}">${s.c.d[0].toUpperCase()}</span><b>${s.c.title}</b><span>· ${s.c.d}</span>`));await t.sleep(250)}}}},

{tag:'Classique',title:'Réponse vocale',desc:'Forme d\'onde animée synchronisée avec une transcription mot à mot et un chrono de lecture.',
 async run(root,t){const a=chat(root,"Lis-moi le résumé de la réunion.");
  const words="Bien sûr. Voici le résumé de la réunion : trois décisions ont été prises, dont le passage à un déploiement hebdomadaire dès la semaine prochaine, et le gel des nouvelles fonctionnalités jusqu'à la fin du sprint.".split(' ');
  const pl=mk('div','player',`<div class="avatar"><span>✦</span></div><div class="wave">${'<i></i>'.repeat(40)}</div><div class="ptime">0:00 / 0:${String(Math.round(words.length*.19)).padStart(2,'0')}</div>`);a.append(pl);
  const bars=$$('.wave i',pl),time=$('.ptime',pl);const tr=mk('div','transcript');a.append(tr);await t.sleep(500);
  const t0=performance.now();let amp=0;const total=Math.round(words.length*.19);
  const anim=t.every(90,()=>{const el=(performance.now()-t0)/1000;amp=.65+.35*Math.abs(Math.sin(el*5.3)*Math.sin(el*1.7));bars.forEach((b,i)=>{const env=.35+.65*Math.sin((i/bars.length)*Math.PI);b.style.height=Math.max(3,amp*env*rnd(12,34))+'px'});time.textContent=`0:${String(Math.min(total,Math.floor(el))).padStart(2,'0')} / 0:${String(total).padStart(2,'0')}`});
  for(const w of words){const s=mk('span','w');s.textContent=w;tr.append(s,' ');await t.sleep(190)}
  t.stop(anim);bars.forEach(b=>b.style.height='3px');time.textContent=`0:${String(total).padStart(2,'0')} / 0:${String(total).padStart(2,'0')}`}},

{tag:'Classique',title:'Multi-agents parallèles',desc:'Trois agents qui diffusent en parallèle à des rythmes différents, puis un orchestrateur qui synthétise.',
 async run(root,t){const a=chat(root,"Prépare une réponse sur la tarification des design systems.");
  const agents=[{n:"Chercheur",c:"#f59e0b",txt:"4 sources récentes trouvées ; les fourchettes vont de 0 à 299 € par siège et par an, avec une médiane à 149 €.",ms:75},{n:"Rédacteur",c:"#3b82f6",txt:"Structure en trois parties : contexte, comparaison des offres, recommandation chiffrée pour une équipe de 8.",ms:100},{n:"Vérificateur",c:"#10b981",txt:"Les chiffres 2024 sont obsolètes : remplacés par les tarifs 2025 lus sur les pages officielles.",ms:85}];
  const grid=mk('div','agents');a.append(grid);
  const els=agents.map(ag=>{const e=mk('div','agent',`<div class="agent-h"><span class="agent-av" style="background:${ag.c}">${ag.n[0]}</span>${ag.n}</div><div class="agent-st"><span class="spin"></span><span class="shimmer">Travaille…</span></div><div class="txt"></div>`);grid.append(e);return e});
  await t.sleep(400);
  await Promise.all(agents.map(async(ag,i)=>{await t.sleep(i*350);await streamWords($('.txt',els[i]),ag.txt,t,{ms:ag.ms});const st=$('.agent-st',els[i]);st.classList.add('ok');st.innerHTML='✓ Terminé';els[i].classList.add('done')}));
  await t.sleep(400);const sy=mk('div','synth','<span class="lbl">Orchestrateur</span>');a.append(sy);const p=mk('p');sy.append(p);
  await streamWords(p,"Pour une équipe de 8, comptez entre 0 € (kit open source) et 2 392 € par an (suite complète). Le meilleur rapport se situe autour de 149 € par siège, tarifs 2025 vérifiés.",t)}}
];

/* ---------- mount ---------- */
const grid=$('#grid'),loopBox=$('#loop');
const cards=demos.map((d,i)=>{
  const card=mk('article','card',`<div class="card-head"><span class="num">${String(i+1).padStart(2,'0')}</span><div><h2>${d.title}<span class="tag ${d.tag==='Agent'?'':'alt'}">${d.tag}</span></h2><p>${d.desc}</p></div><button class="btn replay" title="Rejouer">↻</button></div><div class="stage"></div>`);
  grid.append(card);const stage=$('.stage',card);let t=null;
  async function start(){if(t)t.clear();t=timers();const my=t;stage.innerHTML='';stage.className='stage';await d.run(stage,my);if(my!==t)return;if(loopBox.checked){await my.sleep(3500);if(my===t)start()}}
  $('.replay',card).onclick=start;
  return{start}
});
cards.forEach((c,i)=>setTimeout(c.start,i*120));
$('#replayAll').onclick=()=>cards.forEach((c,i)=>setTimeout(c.start,i*80));
const root=document.documentElement;
$('#theme').onclick=()=>root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
</script>
</body>
</html>
