<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Streaming UI</title>
    <meta name="description" content="Every way an AI response can arrive: streaming, thinking, tool calls and agent states, playing live as React components." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme (or the OS one) and palette before first paint; ThemeProvider keeps it in sync afterwards.
      (function () {
        var t = null;
        try { t = localStorage.getItem('sui-theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', t === 'dark');
        document.documentElement.style.colorScheme = t;
        var p = null;
        try { p = localStorage.getItem('sui-palette'); } catch (e) {}
        if (p === 'dusk' || p === 'slate' || p === 'sand') document.documentElement.setAttribute('data-palette', p);
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
