    <script>
      // Apply the saved theme (or the OS one) and palette before first paint; ThemeProvider keeps it in sync afterwards.
      (function () {
        var t = null;
        try { t = localStorage.getItem('sui-theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', t === 'dark');
        document.documentElement.style.colorScheme = t;
        var p = null;
        try { p = localStorage.getItem('sui-palette'); } catch (e) {}
        if (p === 'dusk' || p === 'slate' || p === 'sand') document.documentElement.setAttribute('data-palette', p);
      })();
    </script>
