# Shuttle swarm stack: one static service. Shuttle adds the hardening (read_only, cap_drop, no-new-privileges),
# the /tmp mount and the edge Caddy route declared in config.json.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging: *logging
